name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

  shellcheck:
    name: ShellCheck (install/uninstall scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck scripts/*.sh
